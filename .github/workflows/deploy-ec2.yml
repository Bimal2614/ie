# On every push to main, SSH into the EC2 server and run scripts/deploy-ec2.sh,
# which pulls main, installs, builds and reloads PM2 (app.yaml).
#
# Repository secrets:  EC2_HOST      public IP or DNS of the instance
#                      EC2_USER      SSH user (ubuntu on Ubuntu AMIs, ec2-user on Amazon Linux)
#                      EC2_SSH_KEY   the private key (.pem contents) for that user
#                      EC2_APP_DIR   absolute path of the repo checkout on the server

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push queues behind the running deploy instead of killing it mid-build.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run deploy script on the server
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # bash -l so the server's PATH (nvm, npm, pm2) is loaded.
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            "bash -lc 'cd \"$EC2_APP_DIR\" && bash scripts/deploy-ec2.sh'"
